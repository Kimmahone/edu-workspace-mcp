name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run check
      - run: npm test
      - name: MCP connection on supported Node versions
        if: matrix.node-version != 20
        run: npm run test:mcp
      - name: Unsupported Node stops before MCP startup
        if: matrix.node-version == 20
        run: node scripts/check-node-requirement.mjs
      - run: npm audit --omit=dev

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack --dry-run

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cloud:check
      - run: npm run test:cloud
      - run: npm run cloud:build
      - run: npx playwright install --with-deps chromium
      - name: Browser Kordoc and Google adapters (mock APIs)
        run: |
          npx wrangler dev --config cloud/wrangler.jsonc --port 3211 > /tmp/workspace-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3211/healthz && break
            sleep 1
          done
          npm run test:cloud:browser
      - name: Public web build and deployment package
        run: |
          npm run cloud:public:build
          npx wrangler deploy --config wrangler.public.jsonc --dry-run
