name: Bug report
description: 재현 가능한 오류를 신고합니다. 토큰이나 학생 정보를 올리지 마세요.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: credentials.json, token.json, 학생·교사 개인정보를 첨부하지 마세요.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
